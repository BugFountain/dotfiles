"$schema" = 'https://starship.rs/config-schema.json'

# Default 500ms is tight when Homebrew bun cold-starts under Gatekeeper/AV
command_timeout = 2000

format = """
[](candy)\
$os\
$username\
[](bg:surface2 fg:candy)\
$directory\
[](bg:purple fg:surface2)\
$git_branch\
$git_status\
[](fg:purple bg:mint)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:mint bg:surface)\
$conda\
[](fg:surface bg:mute)\
$time\
[ ](fg:mute)\
$cmd_duration\
$line_break\
$character"""

palette = 'cyberpunk'

[os]
disabled = false
style = "bg:candy fg:bg"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:candy fg:bg"
style_root = "bg:candy fg:bg"
format = '[ $user]($style)'

[directory]
style = "bg:surface2 fg:ink"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:purple"
format = '[[ $symbol $branch ](fg:bg bg:purple)]($style)'

[git_status]
style = "bg:purple"
format = '[[($all_status$ahead_behind )](fg:bg bg:purple)]($style)'

[nodejs]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[bun]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'
# Home has a package.json; don't treat every dir as Bun
detect_extensions = []
detect_files = ['bunfig.toml', 'bun.lock', 'bun.lockb']
detect_folders = []

[c]
symbol = " "
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[rust]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[golang]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[php]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[java]
symbol = " "
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[kotlin]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[haskell]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version) ](fg:bg bg:mint)]($style)'

[python]
symbol = ""
style = "bg:mint"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:bg bg:mint)]($style)'

[docker_context]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $context) ](fg:ink bg:surface)]($style)'

[conda]
symbol = "  "
style = "fg:ink bg:surface"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:mute"
format = '[[  $time ](fg:bg bg:mute)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:mint)'
error_symbol = '[❯](bold fg:candy)'
vimcmd_symbol = '[❮](bold fg:mint)'
vimcmd_replace_one_symbol = '[❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮](bold fg:purple)'
vimcmd_visual_symbol = '[❮](bold fg:candy2)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:mute"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.cyberpunk]
bg = "#07060b"
ink = "#f1efe8"
mute = "#9a96a8"
surface = "#14121c"
surface2 = "#1c1828"
candy = "#ff2d6a"
candy2 = "#ff5a9a"
purple = "#8b7cff"
mint = "#7dffa8"
